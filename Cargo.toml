[package]
name = "twitch-watch"
version = "0.1.0"
edition = "2024"
description = "Lightweight terminal tool: list your live followed Twitch channels and watch one via streamlink."
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
mockito = "1.7.2"
