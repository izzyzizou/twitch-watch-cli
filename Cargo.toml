[package]
name = "twitch-watch"
version = "0.1.0"
edition = "2024"
description = "Lightweight terminal tool: list your live followed Twitch channels and watch one via streamlink."
license = "MIT"
readme = "README.md"
repository = "https://github.com/izzyzizou/twitch-watch-cli"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", features = ["json"] }

[dev-dependencies]
mockito = "1.7.2"

[profile.release]
lto = true
strip = true
