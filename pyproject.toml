[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-watch-cli"
version = "0.1.0"
description = "Lightweight terminal tool: list your live followed Twitch channels and watch one via streamlink."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
twitch-watch = "twitch_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.basedpyright]
pythonVersion = "3.10"
include = ["src", "tests"]
