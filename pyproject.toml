[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twitch-watch-cli"
version = "0.1.0"
description = "Lightweight terminal tool: list your live followed Twitch channels and watch one via streamlink."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
twitch-watch = "twitch_watch:main"